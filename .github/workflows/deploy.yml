name: Verify (lint + test)

on:
  push:
    branches: [main]
  workflow_dispatch:
    branches: [main]

# 部署已迁至 gh-pages 产物分支（F2：mb publish 本地 build 推产物，Pages 从 gh-pages 分支 serve）。
# 本工作流仅做非阻塞验证（lint + test），不再构建/部署。回退预案见 docs/prd/PRD-F2-fast-publish.md §3。
permissions:
  contents: read

concurrency:
  group: verify
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
