<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <defs>
    <marker id="pmArrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="940" height="470" rx="12" fill="#fafbff"/>

  <!-- 左：复盘流程 -->
  <text x="230" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">事故复盘：四问</text>

  <rect x="40" y="50" width="380" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="60" y="76" font-size="12" font-weight="bold" fill="#991b1b">1 · 什么坏了</text>
  <text x="60" y="96" font-size="10" fill="#b91c1c">真实用户 / 已合并 PR / 已发布版本中的 bug</text>
  <line x1="230" y1="112" x2="230" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pmArrow)"/>

  <rect x="40" y="132" width="380" height="62" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="60" y="158" font-size="12" font-weight="bold" fill="#9a3412">2 · 机制是什么</text>
  <text x="60" y="178" font-size="10" fill="#9a3412">用直白的话说清根因，不归咎个人</text>
  <line x1="230" y1="194" x2="230" y2="212" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pmArrow)"/>

  <rect x="40" y="214" width="380" height="62" rx="10" fill="#e8f0ff" stroke="#2980b9" stroke-width="1.5"/>
  <text x="60" y="240" font-size="12" font-weight="bold" fill="#1a3a8a">3 · 为什么每道安全网都没拦住</text>
  <text x="60" y="260" font-size="10" fill="#2a5aa0">测试 / 工具 / 约定的缺口，而非一次性笔误</text>
  <line x1="230" y1="276" x2="230" y2="294" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#pmArrow)"/>

  <rect x="40" y="296" width="380" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="60" y="322" font-size="12" font-weight="bold" fill="#166534">4 · 新增了什么防护</text>
  <text x="60" y="342" font-size="10" fill="#166534">测试 / AGENTS.md 规则 / ADR，同类 bug 下次明确报错</text>

  <text x="230" y="390" text-anchor="middle" font-size="10" fill="#64748b">隐蔽 · 系统性 · 重新发现的代价高 → 才写复盘</text>
  <text x="230" y="410" text-anchor="middle" font-size="10" fill="#64748b">每篇以三十秒执行摘要开头：坏什么 / 根因 / 为何逃逸 / 教训</text>

  <!-- 右：测试金字塔 -->
  <text x="690" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">测试四层金字塔</text>

  <!-- 顶层：快照 -->
  <polygon points="545,60 835,60 810,100 570,100" fill="#fff3e8" stroke="#e07b39" stroke-width="1.5"/>
  <text x="690" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a00">快照 / 浏览器快照</text>
  <text x="690" y="94" text-anchor="middle" font-size="9" fill="#a04000">test:snapshot · test:web</text>

  <!-- 第二层：真实 API e2e -->
  <polygon points="510,104 870,104 845,144 535,144" fill="#f5effe" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="690" y="123" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b1a8a">真实 API e2e</text>
  <text x="690" y="138" text-anchor="middle" font-size="9" fill="#7a30b0">test:e2e · 带密钥 · 冒烟测试</text>

  <!-- 第三层：覆盖率 100% -->
  <polygon points="475,148 905,148 880,188 500,188" fill="#e8f0ff" stroke="#2980b9" stroke-width="1.5"/>
  <text x="690" y="167" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a8a">覆盖率 100% 门禁</text>
  <text x="690" y="182" text-anchor="middle" font-size="9" fill="#2a5aa0">test:coverage · 按文件 100%</text>

  <!-- 底层：单元测试 -->
  <polygon points="440,192 940,192 915,232 465,232" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="690" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a5a2a">单元测试</text>
  <text x="690" y="226" text-anchor="middle" font-size="9" fill="#2a7a3a">test · vitest · 边界 / 错误 / 并发</text>

  <text x="690" y="262" text-anchor="middle" font-size="10" fill="#64748b">行覆盖率是必要条件，永远不是充分条件</text>
  <text x="690" y="282" text-anchor="middle" font-size="10" fill="#64748b">真实入口路径 &gt; 手动挂载：Loader 冒烟测试能抓住</text>
  <text x="690" y="302" text-anchor="middle" font-size="10" fill="#64748b">「单元全绿、产品却坏了」这一类 mock 无法发现的问题</text>

  <rect x="470" y="330" width="440" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="490" y="352" font-size="11" font-weight="bold" fill="#334155">文档纪律</text>
  <text x="490" y="374" font-size="10" fill="#64748b">verify-type-equiv：从源码提取类型声明并断言文档块匹配，防漂移</text>
  <text x="490" y="394" font-size="10" fill="#64748b">一个事实一个家：每个事实只在一个文件维护，其余引用它</text>
  <text x="490" y="414" font-size="10" fill="#64748b">中文与英文文档配对维护，更新先跑 pnpm run gen-doc-graphs</text>
</svg>
