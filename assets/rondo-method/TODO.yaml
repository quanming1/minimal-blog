# <项目名> 开发任务清单（TODO.yaml）

# 【模板说明】结构化任务清单，替代 TODO.md——按路线图分阶段展开；每步含：
#   涉及模块 / 参考 / 验收标准 / 状态。
# 状态图例：done 已完成 · in_progress 进行中 · todo 未开始
# PRD 驱动：每个阶段开工前先写 PRD（docs/prd/PRD-<阶段>-<名称>.md），流程见 docs/PROCESS.md。
# 消费方：.githooks/check_commit_msg.py 校验 feat/fix 的 scope 阶段标识真实存在。
# 使用：复制后替换阶段内容（A/B/C 分组名与步骤按项目实际路线图改）。

meta:
  source: docs/ROADMAP.md          # 若有路线图文档则引用，否则删除此行
  status_legend:
    done: 已完成
    in_progress: 进行中
    todo: 未开始

stages:
  # ---- 示例分组：A 地基 ----
  - id: A
    name: 地基
    steps:
      - id: A1
        title: CLI 骨架 + 配置系统
        status: done
        date: 2026-08-12
        prd: docs/prd/PRD-A1-<名称>.md
        prd_status: 已验收
        modules:
          - <模块路径 1>
          - <模块路径 2>
        acceptance: 全部通过——<验收证据，如 pytest 20 passed、ruff 全过>
      - id: A2
        title: 核心功能
        status: in_progress
        prd: docs/prd/PRD-A2-<名称>.md
        prd_status: 开发中
        modules:
          - <模块路径>
        acceptance: <可执行的验收标准>

  # ---- 示例分组：B 进阶 ----
  - id: B
    name: 进阶处理
    steps:
      - id: B1
        title: 批量处理
        status: todo
        modules:
          - <模块路径>
        acceptance: <可执行的验收标准>
      - id: B2
        title: 并行执行
        status: todo
        modules:
          - <模块路径>
        acceptance: <可执行的验收标准>

  # ---- 示例分组：G 收尾 ----
  - id: G
    name: 收尾
    steps:
      - id: G1
        title: 测试与 CI
        status: todo
        modules:
          - GitHub Actions CI：lint + test + coverage 阈值
          - 每阶段配单元测试
        acceptance: <可执行的验收标准>
      - id: G2
        title: 文档与示例
        status: todo
        modules:
          - README 完整化
          - 示例目录
        acceptance: <可执行的验收标准>
