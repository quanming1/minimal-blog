# minimal-blog 开发任务清单（结构化数据，Rondo 方法治理——见 docs/PROCESS.md 与 assets/rondo-method/）
# 按博客实际演进反推分阶段；每步含：涉及模块 / 验收标准 / 状态。
# 状态图例：done 已完成 · in_progress 进行中 · todo 未开始
# PRD 驱动：每个阶段开工前先写 PRD（docs/prd/PRD-<阶段>-<名称>.md，模板见 assets/rondo-method/PRD-TEMPLATE.md），流程见 docs/PROCESS.md。

meta:
  source: 博客演进路线（v1.0 → v1.12 已实现 + 未来规划，2026-08-13 反推）
  status_legend:
    done: 已完成
    in_progress: 进行中
    todo: 未开始

stages:
  - id: A
    name: 内容与渲染
    steps:
      - id: A1
        title: Markdown 拓展管线（callout/highlight/deflist/supsub/asset）
        status: done
        prd: （v1.5.0 起迭代，流程见 docs/markdown-extensions.md）
        modules:
          - src/markdown/（index.ts 注册表 + remark/ 插件）
          - src/markdown/remark/（callout / highlight / deflist / supsub / asset + 单测）
          - astro.config.mjs markdown.processor
        acceptance: bun test src/markdown 全绿（58 用例）、docs/markdown-extensions.md 语法清单与实际一致
      - id: A2
        title: SEO 与元数据（canonical/OG/JSON-LD/hreflang/sitemap）
        status: done
        prd: docs/seo.md（v1.6.0）
        modules:
          - src/lib/seo.ts（absoluteUrl/JSON-LD/alternateUrls）
          - src/layouts/Base.astro head
          - docs/seo.md
        acceptance: docs/seo.md §5 产物断言通过（canonical/og:*/JSON-LD/hreflang/sitemap 存在）
      - id: A3
        title: RSS 2.0 feed
        status: done
        prd: （v1.10.0）
        modules:
          - src/lib/rss.ts（零依赖生成器 + 单测）
          - src/pages/rss.xml.ts
        acceptance: /rss.xml 200，条目含 title/link/guid/pubDate（专栏 post 含 <category>），XML 转义正确
  - id: B
    name: 导航与发现
    steps:
      - id: B1
        title: 布局与页面路由（Base 布局 / 首页 / 列表 / 详情 / 404 / about）
        status: done
        modules:
          - src/layouts/Base.astro（导航/语言切换/主题/页脚/搜索/阅读进度）
          - src/pages/**（posts/[slug] / index / 404 / about，zh 无前缀 en 前缀）
        acceptance: 全部路由构建生成、中英切换正确、404 返回 404
      - id: B2
        title: 标签页（/tags/ 云 + /tags/[tag]/ 筛选）
        status: done
        prd: （v1.10.0）
        modules:
          - src/pages/tags/**（zh/en）
          - src/lib/posts.ts getAllTags
        acceptance: tag 云计数正确、tag 筛选页文章正确、无文章 tag 不生成页
      - id: B3
        title: 专栏页（/columns/ 总览 + /columns/[column]/ 系列列表）
        status: done
        prd: （v1.12.0，PRD 驱动首例）
        modules:
          - src/pages/columns/**（zh/en）
          - src/content.config.ts column/columnOrder 字段
          - src/lib/posts.ts getAllColumns/sortColumnPosts
        acceptance: 专栏聚合正确、columnOrder 排序、搜索/RSS 联动（column 可搜、category 输出）
      - id: B4
        title: 站内搜索（Cmd+K）
        status: done
        modules:
          - src/components/SearchDialog.astro + wc/mb-dialog
          - src/lib/search.ts（索引构建/过滤/序列化 + 单测）
        acceptance: 搜索命中 title/description/tags/column、键盘导航、XSS 转义单测全绿
      - id: B5
        title: 阅读体验（TOC/进度条/回顶/上下篇/相关文章/代码复制）
        status: done
        modules:
          - src/components/TocSidebar.astro
          - Base.astro 交互脚本（astro:page-load）
          - src/lib/posts.ts getAdjacentPosts/getRelatedPosts
          - wc/mb-toast（复制提示）
        acceptance: 长文 TOC 高亮、进度条/回顶工作、相邻/相关正确
  - id: C
    name: 主题与视觉
    steps:
      - id: C1
        title: 双主题 + Style Token 体系（design tokens + Tailwind v4）
        status: done
        prd: docs/design-tokens.md（v1.9.0）
        modules:
          - src/styles/global.css（:root 双主题变量 + @theme 语义 token）
          - astro.config.mjs（@tailwindcss/vite）
        acceptance: 亮暗切换无闪烁、token 三层体系（primitive/semantic/utility）文档与实际一致
      - id: C2
        title: Icon 系统（astro-icon + lucide 内联 sprite）
        status: done
        prd: docs/design-tokens.md §7（v1.11.0/v1.12.0）
        modules:
          - astro.config.mjs icon({ include })
          - wc/mb-toast（自包含 check 图标）
        acceptance: 零外部请求、currentColor 双主题、aria-hidden、文档图标清单与实际一致
      - id: C3
        title: 响应式与字体（olivierlacan 风格）
        status: done
        prd: docs/ui-analysis.md §10
        modules:
          - src/styles/global.css 断点体系
          - '@fontsource 自托管'
        acceptance: 375/768/1024/1280 无横向溢出、字体自托管无外链
  - id: D
    name: 工程规范
    steps:
      - id: D1
        title: 提交规范与 git hooks（commit-msg 白名单/pre-push main 保护）
        status: done
        modules:
          - .githooks/check_commit_msg.py + commit-msg + pre-push
        acceptance: 违规提交被拒、合法提交放行（SCOPE_WHITELIST 与 AGENTS.md 同步）
      - id: D2
        title: 测试体系（172 用例全绿）
        status: done
        modules:
          - src/lib/*.test.ts、src/markdown/remark/*.test.ts、src/components/wc/*.test.ts
          - src/test/setup-dom.ts（jsdom 基座）
        acceptance: bun test --parallel=1 全绿（0 fail）
      - id: D3
        title: CI/CD 部署（GitHub Actions → Pages）
        status: done
        modules:
          - .github/workflows/deploy.yml（lint → test → build+smoke → deploy）
        acceptance: push main 自动部署、lint/test/build 全过、smoke 校验页数
      - id: D4
        title: Rondo 方法治理落地（TODO/PRD/PROCESS 反推）
        status: done
        date: 2026-08-13
        prd: docs/PROCESS.md + docs/TODO.yaml + docs/prd/
        modules:
          - docs/TODO.yaml（本文件）
          - docs/PROCESS.md
          - docs/prd/PRD-*.md
        acceptance: 规范文件就位、首个 PRD 驱动阶段（E1）完成闭环
  - id: E
    name: 未来优化
    steps:
      - id: E1
        title: 性能优化（Lighthouse Performance ≥ 90）
        status: done
        date: 2026-08-13
        prd: docs/prd/PRD-E1-performance.md
        modules:
          - 构建产物（CSS/JS/sprite 体积）
          - 首屏加载路径
        acceptance: 本地+线上 Lighthouse Performance ≥ 90，lint/test/build 全绿
      - id: E2
        title: OG 社交分享图（文章默认图）
        status: todo
        modules:
          - Base.astro og:image
          - 静态生成器或占位图
        acceptance: 分享链接显示预览图
      - id: E3
        title: 本地图片支持（懒加载/响应式/AVIF）
        status: todo
        modules:
          - Astro Image 集成或自建
          - 文章图片资产管线
        acceptance: 文章图片懒加载+多尺寸，Lighthouse 图片项通过
      - id: E4
        title: 评论与互动
        status: todo
        modules:
          - 评论系统选型（隐私优先）
        acceptance: 文章页可评论、无跟踪脚本
  - id: F
    name: CLI 与自动化
    steps:
      - id: F1
        title: 博客 CLI（全局 mb 命令：CRUD + 行号级编辑 + 并发安全 publish）
        status: done
        date: 2026-08-13
        prd: docs/prd/PRD-F1-blog-cli.md
        modules:
          - scripts/mb/（CLI 入口与子命令）
          - .ftre/skills/blog-cli/SKILL.md（agent 使用说明）
          - package.json bin + bun link（全局注册）
          - src/pages/en/** 下线 + Base 语言切换移除（CLI 时代只发中文）
        acceptance: mb 全命令可用、行号编辑 hash 并发安全、publish 竞态防护验证、dist 无 en 页面
      - id: F2
        title: 自动化增强（草稿工作流/定时发布）
        status: todo
        modules:
          - mb draft / schedule 子命令
        acceptance: 草稿不构建、定时发布可用
      - id: E5
        title: 国际化扩展
        status: todo
        modules:
          - i18n 字典、hreflang
        acceptance: 新增语言切换正确
