          - '打回上下文自动注入：retry 重跑时上游输出经 initial_input → $LOOP_CONTEXT（复用 C1 机制）'
          - 条件语法：contains（关键词）/ matches（正则，复用 exit_pattern 心智）
          - 加载期校验：loop 存在性 / 条件变量产出链 / max_attempts 合法性
