# rondo 开发任务清单（结构化数据，替代 TODO.md）
# 按 docs/ROADMAP.md 的 12 步路线图展开；每步含：涉及模块 / 参考提交（comanda 对应实现）/ 验收标准 / 状态。
# 状态图例：done 已完成 · in_progress 进行中 · todo 未开始
# PRD 驱动：每个阶段开工前先写 PRD（docs/prd/PRD-<阶段>-<名称>.md），流程见 docs/PROCESS.md。
# 消费方：.githooks/check_commit_msg.py 校验 feat/fix 的 scope 阶段标识真实存在。

meta:
  source: docs/ROADMAP.md
  status_legend:
    done: 已完成
    in_progress: 进行中
    todo: 未开始

